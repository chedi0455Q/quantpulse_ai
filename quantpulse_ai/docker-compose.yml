version: '3.8'

services:
  quantpulse_ai:
    build: .
    container_name: quantpulse_ai_bot
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
